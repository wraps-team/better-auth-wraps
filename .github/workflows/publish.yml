name: Publish

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Required for npm OIDC Trusted Publishing

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Tag format: vX.Y.Z
      - name: Verify package version matches tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")

          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"

          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::Version mismatch! Tag: $TAG_VERSION, package.json: $PKG_VERSION"
            exit 1
          fi

      # Uses npm OIDC Trusted Publishing - no NPM_TOKEN needed.
      # One-time setup on npmjs.com:
      # 1. First publish must be done manually: npm publish --access public
      # 2. Then configure trusted publishing at
      #    https://www.npmjs.com/package/@wraps.dev/better-auth/access
      #    Add GitHub Actions: wraps-team/better-auth-wraps, publish.yml
      - name: Publish to npm
        run: npm publish --access public --provenance
